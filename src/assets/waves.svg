<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="none" fill="none">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b6bd6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#4b6bd6" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#8aa0ee"/>
      <stop offset="1" stop-color="#e45a5a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b6bd6" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#4b6bd6"/>
      <stop offset="1" stop-color="#e45a5a"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <!-- soft glow behind the lines -->
  <path d="M-60 620 C 520 632, 900 632, 1130 384 S 1370 -74, 1530 -198" stroke="url(#glow)" stroke-width="120" opacity="0.15" filter="url(#blur)"/>
  <!-- the flowing lines -->
  <path d="M-60 560 C 520 570, 900 570, 1130 370 S 1370 0, 1530 -100" stroke="url(#line)" stroke-width="0.8" stroke-opacity="0.25" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <path d="M-60 575 C 520 586, 900 586, 1130 374 S 1370 -19, 1530 -125" stroke="url(#line)" stroke-width="1" stroke-opacity="0.32" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <path d="M-60 590 C 520 601, 900 601, 1130 377 S 1370 -37, 1530 -149" stroke="url(#line)" stroke-width="1.3" stroke-opacity="0.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <path d="M-60 605 C 520 617, 900 617, 1130 381 S 1370 -56, 1530 -174" stroke="url(#line)" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <path d="M-60 620 C 520 632, 900 632, 1130 384 S 1370 -74, 1530 -198" stroke="url(#line)" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <path d="M-60 635 C 520 648, 900 648, 1130 388 S 1370 -93, 1530 -223" stroke="url(#line)" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <path d="M-60 650 C 520 664, 900 664, 1130 392 S 1370 -112, 1530 -248" stroke="url(#line)" stroke-width="1.3" stroke-opacity="0.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <path d="M-60 665 C 520 679, 900 679, 1130 395 S 1370 -130, 1530 -272" stroke="url(#line)" stroke-width="1" stroke-opacity="0.32" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <path d="M-60 680 C 520 695, 900 695, 1130 399 S 1370 -149, 1530 -297" stroke="url(#line)" stroke-width="0.8" stroke-opacity="0.25" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  <!-- 8-bit touch: one dashed "pixel" line -->
  <path d="M-60 717 C 520 732, 900 732, 1130 424 S 1370 -145, 1530 -299" stroke="#e45a5a" stroke-width="3" stroke-dasharray="6 9" stroke-opacity="0.3" vector-effect="non-scaling-stroke"/>
</svg>
